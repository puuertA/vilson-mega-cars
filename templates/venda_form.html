{% extends 'layout.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="form-card">
                <div class="form-header">
                    <div class="form-icon">
                        <i class="bi bi-cart-plus"></i>
                    </div>
                    <h4 class="mb-0">Cadastrar Nova Venda</h4>
                </div>
                <div class="form-body">
                    <form method="POST" action="/vendas/cadastrar" id="formVenda">
                        <!-- Seção Dados da Venda -->
                        <div class="section-card">
                            <div class="section-header">
                                <i class="bi bi-receipt me-2"></i>
                                <h5>Informações da Venda</h5>
                            </div>
                            <div class="section-body">
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="data" class="form-label">Data da Venda</label>
                                            <input type="date" class="form-control custom-input" id="data" name="data" required>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="valor_vendido" class="form-label">Valor Vendido</label>
                                            <div class="custom-input-group">
                                                <span class="custom-currency">R$</span>
                                                <input type="number" step="0.01" class="form-control custom-input" 
                                                       id="valor_vendido" name="valor_vendido" 
                                                       placeholder="0,00" required>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Seção Cliente e Veículo -->
                        <div class="section-card">
                            <div class="section-header">
                                <i class="bi bi-person-gear me-2"></i>
                                <h5>Cliente e Veículo</h5>
                            </div>
                            <div class="section-body">
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="idcliente" class="form-label">Cliente</label>
                                            <select class="form-control custom-input custom-select" id="idcliente" name="idcliente" required>
                                                <option value="">Selecione um cliente</option>
                                                {% for cliente in clientes %}
                                                <option value="{{ cliente.idcliente }}">{{ cliente.nome }}</option>
                                                {% endfor %}
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="idplaca" class="form-label">Veículo (Opcional)</label>
                                            <select class="form-control custom-input custom-select" id="idplaca" name="idplaca">
                                                <option value="">Selecione um veículo (opcional)</option>
                                                {% for veiculo in veiculos %}
                                                <option value="{{ veiculo.idplaca }}">{{ veiculo.idplaca }} - {{ veiculo.fabricante }} {{ veiculo.modelo_veiculo }}</option>
                                                {% endfor %}
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Seção Forma de Pagamento -->
                        <div class="section-card">
                            <div class="section-header">
                                <i class="bi bi-credit-card me-2"></i>
                                <h5>Forma de Pagamento</h5>
                            </div>
                            <div class="section-body">
                                <div class="payment-options">
                                    <div class="row">
                                        <div class="col-md-4">
                                            <div class="payment-option">
                                                <input type="radio" class="payment-radio" id="dinheiro" name="forma_pagamento" value="Dinheiro" required>
                                                <label for="dinheiro" class="payment-label">
                                                    <i class="bi bi-cash-stack"></i>
                                                    <span>Dinheiro</span>
                                                </label>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="payment-option">
                                                <input type="radio" class="payment-radio" id="pix" name="forma_pagamento" value="PIX" required>
                                                <label for="pix" class="payment-label">
                                                    <i class="bi bi-qr-code"></i>
                                                    <span>PIX</span>
                                                </label>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="payment-option">
                                                <input type="radio" class="payment-radio" id="credito" name="forma_pagamento" value="Cartão de Crédito" required>
                                                <label for="credito" class="payment-label">
                                                    <i class="bi bi-credit-card-2-front"></i>
                                                    <span>Cartão de Crédito</span>
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row mt-3">
                                        <div class="col-md-4">
                                            <div class="payment-option">
                                                <input type="radio" class="payment-radio" id="debito" name="forma_pagamento" value="Cartão de Débito" required>
                                                <label for="debito" class="payment-label">
                                                    <i class="bi bi-credit-card"></i>
                                                    <span>Cartão de Débito</span>
                                                </label>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="payment-option">
                                                <input type="radio" class="payment-radio" id="transferencia" name="forma_pagamento" value="Transferência" required>
                                                <label for="transferencia" class="payment-label">
                                                    <i class="bi bi-bank"></i>
                                                    <span>Transferência</span>
                                                </label>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="payment-option">
                                                <input type="radio" class="payment-radio" id="financiamento" name="forma_pagamento" value="Financiamento" required>
                                                <label for="financiamento" class="payment-label">
                                                    <i class="bi bi-building"></i>
                                                    <span>Financiamento</span>
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-custom btn-primary-custom">
                                <i class="bi bi-check-lg me-2"></i>Cadastrar Venda
                            </button>
                            <a href="/vendas" class="btn btn-custom btn-secondary-custom">
                                <i class="bi bi-arrow-left me-2"></i>Voltar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Definir data atual como padrão
        const dataInput = document.getElementById('data');
        const hoje = new Date().toISOString().split('T')[0];
        dataInput.value = hoje;

        // Validar formulário antes de enviar
        document.getElementById('formVenda').addEventListener('submit', function(e) {
            const valor = document.getElementById('valor_vendido').value;
            const cliente = document.getElementById('idcliente').value;
            const formaPagamento = document.querySelector('input[name="forma_pagamento"]:checked');

            if (!valor || parseFloat(valor) <= 0) {
                e.preventDefault();
                alert('Por favor, informe um valor válido para a venda.');
                return;
            }

            if (!cliente) {
                e.preventDefault();
                alert('Por favor, selecione um cliente.');
                return;
            }

            if (!formaPagamento) {
                e.preventDefault();
                alert('Por favor, selecione uma forma de pagamento.');
                return;
            }
        });
    });
</script>
{% endblock %}
