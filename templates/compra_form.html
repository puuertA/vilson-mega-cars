{% extends 'layout.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Cadastrar Compra de Veículo</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="/compras/cadastrar">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="idplaca" class="form-label">Veículo</label>
                                <select class="form-control" id="idplaca" name="idplaca" required>
                                    <option value="">Selecione um veículo</option>
                                    {% for veiculo in veiculos %}
                                    <option value="{{ veiculo.idplaca }}">
                                        {{ veiculo.idplaca }} - {{ veiculo.fabricante }} {{ veiculo.modelo_veiculo }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="idcliente" class="form-label">Cliente (Vendedor)</label>
                                <select class="form-control" id="idcliente" name="idcliente" required>
                                    <option value="">Selecione o cliente</option>
                                    {% for cliente in clientes %}
                                    <option value="{{ cliente.idcliente }}">{{ cliente.nome }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="data" class="form-label">Data da Compra</label>
                                <input type="date" class="form-control" id="data" name="data" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="valor_pago" class="form-label">Valor Pago</label>
                                <input type="number" step="0.01" class="form-control" id="valor_pago" name="valor_pago" required>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="forma_pagamento" class="form-label">Forma de Pagamento</label>
                        <select class="form-control" id="forma_pagamento" name="forma_pagamento" required>
                            <option value="">Selecione...</option>
                            <option value="Dinheiro">Dinheiro</option>
                            <option value="PIX">PIX</option>
                            <option value="Transferência">Transferência</option>
                            <option value="Cheque">Cheque</option>
                            <option value="Financiamento">Financiamento</option>
                        </select>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Cadastrar Compra</button>
                        <a href="/compras" class="btn btn-secondary">Voltar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
